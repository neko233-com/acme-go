name: ci
run-name: ci ${{ github.event.inputs.target_os || 'all' }} ${{ github.event.inputs.debug_label || github.ref_name }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      target_os:
        description: Runner to validate while debugging from VS Code
        required: true
        default: all
        type: choice
        options:
          - all
          - ubuntu
          - windows
          - macos
      skip_integration:
        description: Skip live ACME integration tests while debugging CI
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      debug_label:
        description: Optional label shown in the workflow run name for repeated validation
        required: false
        default: vscode-debug

jobs:
  lint-actions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true

      - name: Lint GitHub Actions workflows
        shell: pwsh
        run: ./scripts/validate-github-actions.ps1

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Select runner matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          target="${{ github.event.inputs.target_os || 'all' }}"
          case "$target" in
            ubuntu)
              matrix='{"include":[{"os":"ubuntu-latest","os_key":"ubuntu"}]}'
              ;;
            windows)
              matrix='{"include":[{"os":"windows-latest","os_key":"windows"}]}'
              ;;
            macos)
              matrix='{"include":[{"os":"macos-latest","os_key":"macos"}]}'
              ;;
            all)
              matrix='{"include":[{"os":"ubuntu-latest","os_key":"ubuntu"},{"os":"windows-latest","os_key":"windows"},{"os":"macos-latest","os_key":"macos"}]}'
              ;;
            *)
              echo "Unsupported target_os: $target" >&2
              exit 1
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  test:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show debug context
        shell: bash
        run: |
          echo "event=${{ github.event_name }}"
          echo "runner=${{ runner.os }}"
          echo "target_os=${{ github.event.inputs.target_os || 'all' }}"
          echo "skip_integration=${{ github.event.inputs.skip_integration || 'true' }}"
          echo "debug_label=${{ github.event.inputs.debug_label || '' }}"
          echo "sha=${{ github.sha }}"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true

      - name: Prepare Unix script
        if: runner.os != 'Windows'
        run: chmod +x test-auto.sh

      - name: Run Windows automation script
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if "${{ github.event.inputs.skip_integration || 'true' }}"=="true" (
            test-auto.cmd --skip-integration
          ) else (
            test-auto.cmd
          )

      - name: Run Unix automation script
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ github.event.inputs.skip_integration || 'true' }}" = "true" ]; then
            ./test-auto.sh --skip-integration
          else
            ./test-auto.sh
          fi
