name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      skip_integration:
        description: Skip live ACME integration tests while debugging CI
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true

      - name: Prepare Unix script
        if: runner.os != 'Windows'
        run: chmod +x test-auto.sh

      - name: Run Windows automation script
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if "${{ github.event.inputs.skip_integration || 'true' }}"=="true" (
            test-auto.cmd --skip-integration
          ) else (
            test-auto.cmd
          )

      - name: Run Unix automation script
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ github.event.inputs.skip_integration || 'true' }}" = "true" ]; then
            ./test-auto.sh --skip-integration
          else
            ./test-auto.sh
          fi