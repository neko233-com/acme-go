name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true

      - name: Prepare Unix script
        if: runner.os != 'Windows'
        run: chmod +x test-auto.sh

      - name: Run Windows automation script
        if: runner.os == 'Windows'
        shell: cmd
        run: test-auto.cmd --skip-integration

      - name: Run Unix automation script
        if: runner.os != 'Windows'
        shell: bash
        run: ./test-auto.sh --skip-integration