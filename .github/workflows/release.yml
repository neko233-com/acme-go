name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true

      - name: Build artifact
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          suffix=""
          if [ "$GOOS" = "windows" ]; then
            suffix=".exe"
          fi
          binary="acme-go${suffix}"
          outdir="dist/acme-go_${GOOS}_${GOARCH}"
          mkdir -p "$outdir"
          go build -trimpath -ldflags "-s -w" -o "$outdir/$binary" .
          cp README.md "$outdir/README.md"
          cp config.example.yaml "$outdir/config.example.yaml"
          cp how-to-use.html "$outdir/how-to-use.html"
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -r "acme-go_${GOOS}_${GOARCH}.zip" "acme-go_${GOOS}_${GOARCH}")
          else
            tar -C dist -czf "dist/acme-go_${GOOS}_${GOARCH}.tar.gz" "acme-go_${GOOS}_${GOARCH}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: acme-go_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/acme-go_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            dist/acme-go_${{ matrix.goos }}_${{ matrix.goarch }}.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: acme-go_*
          merge-multiple: true

      - name: Build release manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-docs
          cp README.md release-docs/README.md
          cp config.example.yaml release-docs/config.example.yaml
          cp how-to-use.html release-docs/how-to-use.html
          tar -C release-docs -czf docs_bundle.tar.gz .
          cd dist-artifacts
          sha256sum * > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-artifacts/*
            docs_bundle.tar.gz