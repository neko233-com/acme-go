name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true

      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Build artifact
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          suffix=""
          if [ "$GOOS" = "windows" ]; then
            suffix=".exe"
          fi
          binary="acme233${suffix}"
          outdir="dist/acme233_${GOOS}_${GOARCH}"
          mkdir -p "$outdir"
          version_value="${VERSION#v}"
          go build -trimpath -ldflags "-s -w -X main.version=${version_value}" -o "$outdir/$binary" .
          cp README.md "$outdir/README.md"
          cp README.en.md "$outdir/README.en.md"
          cp how-to-use.html "$outdir/how-to-use.html"
          cp -r _doc "$outdir/_doc"
          cp config_acme.json "$outdir/config_acme.json"
          cp config_acme.local.example.json "$outdir/config_acme.local.example.json"
          cp install.sh "$outdir/install.sh"
          cp install.ps1 "$outdir/install.ps1"
          cp install-systemd-service.sh "$outdir/install-systemd-service.sh"
          cp install-windows-service.cmd "$outdir/install-windows-service.cmd"
          (cd dist && zip -r "acme233_${GOOS}_${GOARCH}.zip" "acme233_${GOOS}_${GOARCH}")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: acme233_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/acme233_${{ matrix.goos }}_${{ matrix.goarch }}.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: acme233_*
          merge-multiple: true

      - name: Build release manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist-artifacts
          sha256sum ./* > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-artifacts/*
