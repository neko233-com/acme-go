ca:
  directory_url: https://acme-v02.api.letsencrypt.org/directory

account:
  email: ops@example.com
  key_path: .acme/account.pem
  accept_tos: true

automation:
  # 自动续期间隔，支持 Go duration 写法，例如 30m、6h、24h。
  # 大多数用户直接保留 24h 即可，再配合 `go run . auto-renew -config config.yaml` 长期运行。
  renew_interval: 24h
  # 单次自动续期失败后的首次重试等待时间；后续会按指数退避放大。
  retry_backoff: 1m
  # 指数退避的最大等待时间，避免失败时越等越久。
  max_retry_backoff: 15m
  # 每轮自动续期失败后最多重试多少次。写 0 表示本轮失败后不重试。
  max_retry_attempts: 5
  # 每次失败后都会执行这些命令，并带上 ACME_LOOP_* 环境变量。
  # 留空表示只输出日志；你也可以接企业微信、钉钉、邮件脚本。
  failure_commands: []

dns:
  # 这里放所有证书共用的 DNS 默认值；如果证书显式绑定了命名 provider，会在这里的基础上继续覆盖。
  disable_cname_support: false
  disable_complete_propagation: false
  recursive_nameservers: []
  # 如果某家云厂商还需要专用环境变量，也可以直接写在 env 里，优先级高于自动推导。
  env: {}

dns_providers:
  aliyun-cn:
    provider: alicloud-cn
    account_mode: cn
    credentials:
      access_key: ${ALICLOUD_ACCESS_KEY}
      secret_key: ${ALICLOUD_SECRET_KEY}
  cloudflare-global:
    provider: cloudflare
    credentials:
      api_token: ${CLOUDFLARE_DNS_API_TOKEN}

certificates:
  - name: example-prod
    domains:
      - example.com
      - '*.example.com'
    dns:
      provider_ref: aliyun-cn
    output_dir: certs/example-prod
    output_files:
      # 叶子证书文件。常见命名：cert.pem、tls.crt、server.crt。
      cert_file: cert.pem
      # 私钥文件。常见命名：privkey.pem、tls.key、server.key。
      key_file: privkey.pem
      # 从证书导出的公钥文件。常见命名：pubkey.pem、server.pub。
      public_key_file: pubkey.pem
      # fullchain，适合直接给 nginx 等服务使用。常见命名：fullchain.pem、fullchain.crt、server.crt。
      fullchain_file: fullchain.pem
      # 仅签发链。常见命名：issuer.pem、chain.pem、ca.crt。
      chain_file: issuer.pem
      # 续期元数据。常见命名：metadata.json、acme.json。
      metadata_file: metadata.json
    key_type: ec256
    preferred_chain: ""
    must_staple: false
    csr_path: ""
    renew_before_days: 30
    challenge: dns-01
    webroot_path: ""
    http_bind: 0.0.0.0
    http_port: "80"
    tlsalpn_bind: 0.0.0.0
    tlsalpn_port: "443"
    install:
      key_file: ""
      public_key_file: ""
      fullchain_file: ""
      metadata_file: ""
    deploy:
      - name: local-copy
        type: copy
        directory: deploy/example-prod
      - name: reload-service
        type: command
        # 证书落盘后执行你自己的重载命令，例如 nginx -s reload、systemctl reload nginx。
        command: echo reload-service
    hooks:
      pre_issue: []
      post_issue: []
      pre_renew: []
      post_renew: []
      post_revoke: []
      post_install: []
      post_deploy: []
    bundle: true

  - name: example-global
    domains:
      - api.example.com
    dns:
      provider_ref: cloudflare-global
    output_dir: certs/example-global
    challenge: dns-01
    key_type: ec256
    renew_before_days: 30
    install: {}
    deploy: []
    hooks:
      pre_issue: []
      post_issue: []
      pre_renew: []
      post_renew: []
      post_revoke: []
      post_install: []
      post_deploy: []
    bundle: true