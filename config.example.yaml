ca:
  directory_url: https://acme-v02.api.letsencrypt.org/directory

account:
  email: ops@example.com
  key_path: .acme/account.pem
  accept_tos: true

dns:
  # Global defaults shared by all certificate entries unless they point at a named provider.
  disable_cname_support: false
  disable_complete_propagation: false
  recursive_nameservers: []
  # env still works and has higher priority when you need vendor-specific overrides.
  env: {}

dns_providers:
  aliyun-cn:
    provider: alicloud-cn
    account_mode: cn
    credentials:
      access_key: ${ALICLOUD_ACCESS_KEY}
      secret_key: ${ALICLOUD_SECRET_KEY}
  cloudflare-global:
    provider: cloudflare
    credentials:
      api_token: ${CLOUDFLARE_DNS_API_TOKEN}

certificates:
  - name: example-prod
    domains:
      - example.com
      - '*.example.com'
    dns:
      provider_ref: aliyun-cn
    output_dir: certs/example-prod
    output_files:
      # Leaf certificate. Suggested names: cert.pem, tls.crt, server.crt.
      cert_file: cert.pem
      # Private key. Suggested names: privkey.pem, tls.key, server.key.
      key_file: privkey.pem
      # Public key derived from the certificate. Suggested names: pubkey.pem, server.pub.
      public_key_file: pubkey.pem
      # Leaf + issuer chain. Suggested names: fullchain.pem, fullchain.crt, server.crt for nginx.
      fullchain_file: fullchain.pem
      # Issuer chain only. Suggested names: issuer.pem, chain.pem, ca.crt.
      chain_file: issuer.pem
      # Renewal metadata. Suggested names: metadata.json, acme.json.
      metadata_file: metadata.json
    key_type: ec256
    preferred_chain: ""
    must_staple: false
    csr_path: ""
    renew_before_days: 30
    challenge: dns-01
    webroot_path: ""
    http_bind: 0.0.0.0
    http_port: "80"
    tlsalpn_bind: 0.0.0.0
    tlsalpn_port: "443"
    install:
      key_file: ""
      public_key_file: ""
      fullchain_file: ""
      metadata_file: ""
    deploy:
      - name: local-copy
        type: copy
        directory: deploy/example-prod
      - name: reload-service
        type: command
        command: echo reload-service
    hooks:
      pre_issue: []
      post_issue: []
      pre_renew: []
      post_renew: []
      post_revoke: []
      post_install: []
      post_deploy: []
    bundle: true

  - name: example-global
    domains:
      - api.example.com
    dns:
      provider_ref: cloudflare-global
    output_dir: certs/example-global
    challenge: dns-01
    key_type: ec256
    renew_before_days: 30
    install: {}
    deploy: []
    hooks:
      pre_issue: []
      post_issue: []
      pre_renew: []
      post_renew: []
      post_revoke: []
      post_install: []
      post_deploy: []
    bundle: true