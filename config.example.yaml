ca:
  directory_url: https://acme-v02.api.letsencrypt.org/directory

account:
  email: ops@example.com
  key_path: .acme/account.pem
  accept_tos: true

dns:
  provider: alicloud
  env:
    ALICLOUD_ACCESS_KEY: ${ALICLOUD_ACCESS_KEY}
    ALICLOUD_SECRET_KEY: ${ALICLOUD_SECRET_KEY}

certificates:
  - name: example-prod
    domains:
      - example.com
      - '*.example.com'
    output_dir: certs/example-prod
    key_type: ec256
    preferred_chain: ""
    must_staple: false
    csr_path: ""
    renew_before_days: 30
    challenge: dns-01
    webroot_path: ""
    http_bind: 0.0.0.0
    http_port: "80"
    tlsalpn_bind: 0.0.0.0
    tlsalpn_port: "443"
    install:
      key_file: ""
      fullchain_file: ""
    deploy:
      - name: local-copy
        type: copy
        directory: ""
      - name: reload-service
        type: command
        command: ""
    hooks:
      pre_issue: []
      post_issue: []
      pre_renew: []
      post_renew: []
      post_revoke: []
      post_install: []
      post_deploy: []
    bundle: true